name: Record translation completeness

on:
  push:
    branches: ['**']

permissions:
  contents: write

concurrency:
  group: translation-completeness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  record:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}
      - name: Generate and publish reports
        env:
          REPORT_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Refresh only the latest locale snapshot; no commit history report.
          for attempt in 1 2 3; do
            git fetch origin "$REPORT_BRANCH"
            # This is an ephemeral CI checkout; reset only its generated state.
            git reset --hard FETCH_HEAD
            python3 scripts/record_commit_progress.py --committed
            git add -- docs/reports/TranslationCompleteness*.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'chore: update translation completeness [skip ci]'
            if git push origin "HEAD:refs/heads/$REPORT_BRANCH"; then exit 0; fi
          done
          echo 'Could not publish reports after three attempts' >&2
          exit 1
